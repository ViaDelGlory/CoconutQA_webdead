[pytest]
# Регистрация кастомных маркеров
markers =
    smoke: Дымовые тесты - проверка основного функционала
    regress: Регрессионные тесты - запускаются после каждого изменения
    critical: Критически важные тесты
    negative: Негативные тесты - проверка ошибок
    boundary: Граничные тесты - проверка крайних значений
    security: Тесты безопасности - проверка прав доступа
    db: Тесты с проверкой БД
    integration: Интеграционные тесты
    movies: Все тесты модуля Movies
    auth: Тесты модуля Auth
    api: API тесты
    ui: UI тесты
    slow: Медленные тесты
    fast: Быстрые тесты

# Настройки pytest
addopts =
    -v
    --strict-markers
    --tb=short
    --maxfail=5

# Пути для тестов
testpaths =
    tests

# Настройки логирования
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Игнорирование предупреждений
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning